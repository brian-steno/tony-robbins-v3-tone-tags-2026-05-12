<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tony Voice Review</title>
    <style>
      :root {
        --bg: #f6f1e8;
        --panel: #fffdf8;
        --line: #d8cdbd;
        --text: #221d17;
        --muted: #6a6155;
        --accent: #8f431d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: linear-gradient(180deg, #efe2d0 0%, var(--bg) 220px);
        color: var(--text);
      }

      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 28px 18px 48px;
      }

      h1,
      h2 {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 2.6rem;
        line-height: 1.05;
      }

      p {
        color: var(--muted);
      }

      a {
        color: var(--accent);
      }

      .hero,
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(31, 27, 22, 0.05);
      }

      .hero {
        padding: 26px 26px 22px;
        margin-bottom: 18px;
      }

      .cta {
        display: inline-block;
        margin-top: 12px;
        padding: 11px 16px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 16px;
      }

      .card {
        padding: 18px;
      }

      .card h2 {
        margin: 0 0 6px;
        font-size: 1.2rem;
      }

      .card a {
        display: inline-block;
        margin-top: 12px;
        font-weight: 600;
      }

      audio {
        width: 100%;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>Tony Voice Review</h1>
        <p>
          Listen to the audio or use the live chat for each model.
        </p>
        <p>
          Record a 1-10 rating with comments in
          <a href="https://linear.app/stenoai/issue/S-1484/tone-tag-review-tony-robbins-v3-elevenlabs-flashturbottd-vs-cartesia">S-1484</a>.
        </p>
      </section>

      <section class="grid">
        <article class="card">
          <h2>Flash</h2>
          <audio controls preload="none" src="supporting-clips/fourteen-day-turnaround/audio/tony_flash.wav"></audio>
          <a href="https://dev.chat.steno.ai/chat?id=tony-business-coaching-review-pvc&amp;mode=fullscreen&amp;prompt_set_id=tony-voice-review-flash-20260520">Live chat</a>
        </article>

        <article class="card">
          <h2>Turbo</h2>
          <audio controls preload="none" src="supporting-clips/fourteen-day-turnaround/audio/tony_turbo.wav"></audio>
          <a href="https://dev.chat.steno.ai/chat?id=tony-business-coaching-review-pvc&amp;mode=fullscreen&amp;prompt_set_id=tony-voice-review-turbo-20260520">Live chat</a>
        </article>

        <article class="card">
          <h2>v3 plain</h2>
          <audio controls preload="none" src="supporting-clips/fourteen-day-turnaround/audio/tony_ttd_plain.wav"></audio>
          <a href="https://dev.chat.steno.ai/chat?id=tony-business-coaching-review-pvc&amp;mode=fullscreen&amp;prompt_set_id=tony-voice-review-v3-plain-20260520">Live chat</a>
        </article>

        <article class="card">
          <h2>v3 tagged</h2>
          <audio controls preload="none" src="supporting-clips/fourteen-day-turnaround/audio/tony_ttd_tagged.wav"></audio>
          <a href="https://dev.chat.steno.ai/chat?id=tony-business-coaching-review-pvc&amp;mode=fullscreen&amp;prompt_set_id=tony-voice-review-v3-tagged-20260520">Live chat</a>
        </article>

        <article class="card">
          <h2>Cartesia Sonic 3</h2>
          <audio controls preload="none" src="supporting-clips/fourteen-day-turnaround/audio/cartesia_clone.wav"></audio>
          <a href="https://dev.chat.steno.ai/chat?id=tony-business-coaching-cartesia&amp;mode=fullscreen&amp;prompt_set_id=tony-voice-review-v3-plain-20260520">Live chat</a>
        </article>

        <article class="card">
          <h2>Cartesia Sonic 3.5</h2>

        </article>
      </section>
    </main>
  </body>
</html>
